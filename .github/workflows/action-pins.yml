name: Action Pins

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  toolchain-pins:
    name: Toolchain Pins
    runs-on: ubuntu-latest

    # The workflow token has no scope covering workflow files, so opening the pull
    # request needs ACTION_PIN_TOKEN, a personal token carrying the workflow scope.
    # Without it this job reports the drift and fails instead.
    env:
      PIN_TOKEN: ${{ secrets.ACTION_PIN_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.ACTION_PIN_TOKEN || github.token }}

      - name: Refresh the toolchain pins
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/refresh-action-pins.sh
          if git diff --quiet -- .github/workflows; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request with the refreshed pins
        if: steps.pins.outputs.stale == 'true' && env.PIN_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.ACTION_PIN_TOKEN }}
        run: |
          branch=ci/refresh-action-pins
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .github/workflows
          git commit -m "Refresh the toolchain action pins"
          # The branch carries nothing but this job's output, so it is replaced wholesale.
          git push --force origin "$branch"
          gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN && exit 0
          gh pr create --base main --head "$branch" \
            --title "Refresh the toolchain action pins" \
            --body "The pinned digests no longer match the heads of the branches their comments name, so the workflows were running an older copy of the toolchain action than the branch selects. Regenerated by the weekly check."

      - name: Report the drift when no token is configured
        if: steps.pins.outputs.stale == 'true' && env.PIN_TOKEN == ''
        run: |
          git --no-pager diff -- .github/workflows
          echo "set ACTION_PIN_TOKEN to have this opened as a pull request" >&2
          exit 1
