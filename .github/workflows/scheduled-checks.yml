name: Scheduled Checks

on:
  schedule:
    - cron: "17 4 1 * *"
    - cron: "17 4 2-31 * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

# Tag refs isolate release gates from scheduled runs.
concurrency:
  group: internetarchive-scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny

      - name: Audit dependencies for new advisories
        run: cargo audit --deny warnings

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

  feature-matrix:
    name: Feature Matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            command: cargo test --locked
          - name: indicatif
            command: cargo test --features indicatif --locked
          - name: ring-tls-all
            command: cargo test --no-default-features --features rustls-ring-tls,indicatif --locked
          - name: native-tls
            command: cargo test --no-default-features --features native-tls --locked
          - name: rustls-tls
            command: cargo test --no-default-features --features rustls-tls,indicatif --locked

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run tests
        run: ${{ matrix.command }}

  live-api-suite:
    name: Live Full API Suite
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 4 1 * *' }}
    runs-on: ubuntu-latest
    needs: feature-matrix
    timeout-minutes: 120
    environment: internetarchive-live
    env:
      RUST_BACKTRACE: "1"
      INTERNET_ARCHIVE_ACCESS_KEY: ${{ secrets.INTERNET_ARCHIVE_ACCESS_KEY }}
      INTERNET_ARCHIVE_SECRET_KEY: ${{ secrets.INTERNET_ARCHIVE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Validate live credentials
        shell: bash
        run: |
          test -n "$INTERNET_ARCHIVE_ACCESS_KEY" || { echo "Missing INTERNET_ARCHIVE_ACCESS_KEY secret"; exit 1; }
          test -n "$INTERNET_ARCHIVE_SECRET_KEY" || { echo "Missing INTERNET_ARCHIVE_SECRET_KEY secret"; exit 1; }

      - name: Run live full API suite
        run: cargo test --test live_smoke --no-default-features --features rustls-ring-tls,indicatif --locked -- --nocapture --test-threads=1
